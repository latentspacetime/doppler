[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doppler-recall"
version = "0.1.0"
description = "Estimate how much of the relevant set your retriever never returns, without relevance labels."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["retrieval", "rag", "recall", "capture-recapture", "evaluation", "vector-search"]
authors = [{ name = "latentspacetime" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/latentspacetime/doppler"
Source = "https://github.com/latentspacetime/doppler"
Issues = "https://github.com/latentspacetime/doppler/issues"

[project.scripts]
doppler-recall = "doppler.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/doppler"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
